[package]
name = "hfcv-trigger"
version = "0.1.0"
edition = "2021"
description = "Optional Raspberry Pi Pico trigger board for the high fps camera capture server"

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-sync = "0.7"
embassy-time = "0.5"
embassy-usb = { version = "0.6" }
embassy-futures = "0.1"
heapless = "0.8"
panic-halt = "1"
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2"
hfcv-protocol = { path = "protocol" }

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
opt-level = "s"

[workspace]
members = ["protocol"]
