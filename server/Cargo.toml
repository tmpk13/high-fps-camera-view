[package]
name = "hfcv-server"
version = "0.1.0"
edition = "2021"
description = "Capture server and web UI host for high fps camera time measurement"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
jpeg-encoder = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
v4l = "0.14"
